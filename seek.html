<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Eason 的画里寻宝</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#173a4d;
    --ink-soft:#3d6076;
    --panel:#ffffff;
    --panel-ink:#173a4d;
    --gold:#f5a623;
    --teal:#1d7f8c;
    --bg1:#bfe8f2;
    --bg2:#5fb6cf;
    --bg3:#2e7ea6;
    --slot-bg:rgba(255,255,255,.45);
    --slot-line:rgba(23,58,77,.35);
    --hud-bg:rgba(255,255,255,.82);
    --shadow:0 10px 30px rgba(10,50,80,.28);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eaf7fc;
      --ink-soft:#b9d9e6;
      --panel:#123243;
      --panel-ink:#eaf7fc;
      --bg1:#0d3247;
      --bg2:#0a4a63;
      --bg3:#062636;
      --slot-bg:rgba(255,255,255,.14);
      --slot-line:rgba(255,255,255,.4);
      --hud-bg:rgba(10,42,60,.85);
      --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Baloo 2","ZCOOL KuaiLe","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    display:flex; flex-direction:column;
    height:100dvh; overflow:hidden;
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- HUD ---------- */
  header{
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    background:var(--hud-bg);
    backdrop-filter:blur(6px);
    box-shadow:0 2px 12px rgba(10,50,80,.15);
    z-index:30;
  }
  .album{
    display:flex; gap:5px; justify-content:space-between; align-items:center;
    max-width:560px; margin:0 auto;
  }
  .slot{
    flex:1 1 0; max-width:44px; aspect-ratio:1/1;
    border-radius:50%;
    background:var(--slot-bg);
    border:2px dashed var(--slot-line);
    display:flex; align-items:center; justify-content:center;
    transition:background .3s, border-color .3s;
  }
  .slot svg{ width:82%; height:82%; filter:grayscale(1); opacity:.28; transition:filter .3s, opacity .3s; }
  .slot.lit{ background:#fff; border:2px solid var(--gold); }
  .slot.lit svg{ filter:none; opacity:1; }
  .slot.pop{ animation:slotPop .5s ease; }
  @keyframes slotPop{ 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }

  .statusbar{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    flex-wrap:wrap;
    max-width:560px; margin:8px auto 0;
  }
  .progress{
    font-family:"ZCOOL KuaiLe","Baloo 2",sans-serif;
    font-size:clamp(20px,5.6vw,26px); letter-spacing:.5px; white-space:nowrap;
  }
  .progress b{ color:var(--teal); font-size:1.25em; }
  @media (prefers-color-scheme: dark){ .progress b{ color:#7fd8e8; } }
  .timer{
    font-size:clamp(17px,4.8vw,21px); font-weight:800; color:var(--ink-soft);
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .hint-btn{
    min-height:44px; padding:8px 11px;
    border:none; border-radius:999px;
    background:var(--gold); color:#4a2f00;
    font-size:15.5px; font-weight:800;
    box-shadow:0 3px 0 #c77f0a;
    white-space:nowrap;
  }
  .hint-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #c77f0a; }
  .hint-btn:disabled{ background:#b9c6cc; color:#5a6d75; box-shadow:0 3px 0 #8fa1a9; }

  /* ---------- Stage ---------- */
  #stageWrap{
    flex:1 1 auto; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:10px 6px calc(10px + env(safe-area-inset-bottom));
  }
  #frame{
    position:relative;
    width:min(94vw, calc((100dvh - 215px) * 0.7015), 480px);
    aspect-ratio:752/1072;
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
    background:#7fc4d8;
    touch-action:none;
  }
  #zoomLayer{
    position:absolute; inset:0;
    transform-origin:0 0;
    will-change:transform;
  }
  #zoomLayer img.painting{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; pointer-events:none;
  }
  .cloud{
    position:absolute; top:.4%; right:-7%; width:38%;
    pointer-events:none; z-index:5;
    animation:drift 8s ease-in-out infinite alternate;
    filter:drop-shadow(0 3px 5px rgba(90,140,160,.35));
  }
  @keyframes drift{ from{ transform:translateX(-4%);} to{ transform:translateX(5%);} }

  .animal{
    position:absolute; z-index:6;
    width:16.5%; aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    background:transparent; border:none; padding:0;
    min-height:44px; min-width:44px;
  }
  .animal svg{
    width:100%; height:100%; display:block;
    opacity:.95;
    filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 2px 3px rgba(10,60,80,.4));
    animation:sway 3.4s ease-in-out infinite alternate;
  }
  @keyframes sway{ from{ transform:rotate(-4deg) translateY(-1.5%);} to{ transform:rotate(4deg) translateY(1.5%);} }
  .animal.found{ pointer-events:none; }
  .animal.found svg{ animation:foundPop .45s ease forwards; }
  @keyframes foundPop{
    0%{ transform:scale(1) rotate(0); }
    45%{ transform:scale(1.55) rotate(-8deg); }
    100%{ transform:scale(1.3) rotate(0); opacity:0; }
  }
  .animal.hinting svg{ animation:hintBlink .38s ease-in-out 4; }
  @keyframes hintBlink{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 2px rgba(255,255,255,.95)); }
    50%{ transform:scale(1.45); filter:drop-shadow(0 0 10px #ffd94d) drop-shadow(0 0 4px #ffb300); }
  }
  .ripple{
    position:absolute; z-index:4; pointer-events:none;
    width:12%; aspect-ratio:1/1; border-radius:50%;
    border:3px solid rgba(255,255,255,.9);
    transform:translate(-50%,-50%) scale(.25);
    animation:rip .65s ease-out forwards;
  }
  @keyframes rip{ to{ transform:translate(-50%,-50%) scale(1.15); opacity:0; } }

  .zoomctl{
    position:absolute; right:10px; bottom:10px; z-index:20;
    display:flex; flex-direction:column; gap:8px;
  }
  .zoomctl button{
    width:46px; height:46px; border-radius:50%;
    border:none; background:rgba(255,255,255,.92); color:#173a4d;
    font-size:24px; font-weight:800; line-height:1;
    box-shadow:0 3px 8px rgba(10,50,80,.3);
  }
  .zoomctl button:active{ transform:scale(.93); }
  .zoomctl button.small{ font-size:14px; }

  #toast{
    position:absolute; left:50%; top:12px; z-index:25;
    transform:translateX(-50%) scale(.6);
    background:#fff; color:#173a4d;
    font-family:"ZCOOL KuaiLe","Baloo 2",sans-serif;
    font-size:clamp(20px,5.5vw,26px);
    padding:8px 20px; border-radius:999px;
    box-shadow:0 6px 18px rgba(10,50,80,.3);
    opacity:0; pointer-events:none; white-space:nowrap;
  }
  #toast.show{ animation:toastIn 1.25s ease forwards; }
  @keyframes toastIn{
    0%{ opacity:0; transform:translateX(-50%) scale(.6); }
    15%{ opacity:1; transform:translateX(-50%) scale(1.08); }
    25%{ transform:translateX(-50%) scale(1); }
    80%{ opacity:1; }
    100%{ opacity:0; transform:translateX(-50%) scale(1) translateY(-8px); }
  }

  .flyer{
    position:fixed; z-index:60; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .flyer svg{ width:100%; height:100%; filter:drop-shadow(0 2px 4px rgba(10,60,80,.35)); }

  /* ---------- Overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:rgba(8,45,66,.45);
    backdrop-filter:blur(3px);
  }
  .overlay[hidden]{ display:none; }
  .card{
    background:var(--panel); color:var(--panel-ink);
    border-radius:26px; padding:28px 24px 24px;
    max-width:430px; width:100%;
    text-align:center;
    box-shadow:0 18px 44px rgba(0,20,40,.4);
    max-height:92dvh; overflow-y:auto;
  }
  .card h1{
    font-family:"ZCOOL KuaiLe","Baloo 2",sans-serif;
    font-size:clamp(30px,8.5vw,40px); margin:0 0 6px; letter-spacing:1px;
    color:var(--teal);
  }
  @media (prefers-color-scheme: dark){ .card h1{ color:#7fd8e8; } }
  .card h2{
    font-family:"ZCOOL KuaiLe","Baloo 2",sans-serif;
    font-size:clamp(28px,8vw,36px); margin:0 0 6px; color:var(--teal);
  }
  @media (prefers-color-scheme: dark){ .card h2{ color:#7fd8e8; } }
  .card p{ font-size:clamp(17px,4.8vw,20px); line-height:1.55; margin:8px 0; }
  .card .tip{ font-size:15px; color:var(--ink-soft); }
  .big-btn{
    margin-top:16px;
    min-height:60px; padding:12px 42px;
    border:none; border-radius:999px;
    background:var(--teal); color:#fff;
    font-family:"ZCOOL KuaiLe","Baloo 2",sans-serif;
    font-size:clamp(22px,6vw,27px); letter-spacing:2px;
    box-shadow:0 5px 0 #145e68;
  }
  .big-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 #145e68; }
  .credit{ margin-top:16px; font-size:15px; color:var(--ink-soft); }
  .mini-animals{ display:flex; justify-content:center; gap:2px; margin:10px 0 2px; flex-wrap:wrap; }
  .mini-animals svg{ width:34px; height:34px; animation:sway 2.6s ease-in-out infinite alternate; }
  .win-time{ font-size:clamp(19px,5.4vw,23px); font-weight:800; }
  .win-time b{ color:var(--gold); font-size:1.3em; }
  .parade{
    margin:14px -6px 0; padding:16px 4px 4px;
    display:flex; flex-wrap:wrap; justify-content:center; gap:4px;
    background:linear-gradient(180deg, transparent 30%, rgba(64,164,196,.35) 31%, rgba(38,110,178,.55));
    border-radius:0 0 18px 18px;
  }
  .parade svg{ width:52px; height:52px; animation:bob 1.1s ease-in-out infinite alternate; }
  @keyframes bob{ from{ transform:translateY(-5px) rotate(-4deg);} to{ transform:translateY(4px) rotate(4deg);} }
  .sparkle{
    position:absolute; width:9px; height:9px; border-radius:50%;
    background:#ffd94d; pointer-events:none;
    animation:sparkleFall linear forwards;
  }
  @keyframes sparkleFall{ to{ transform:translateY(46px) scale(.3); opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    .animal svg, .cloud, .mini-animals svg, .parade svg{ animation:none !important; }
  }
</style>
</head>

    snail: '<svg viewBox="0 0 64 64"><path d="M8 50 q14-4 30-2 l14 2 q4 1 3 4 q-1 3-6 3 l-38-1 q-8-1-3-6z" fill="#a8d86e"/><path d="M48 44 v-12 M54 44 v-14" stroke="#8bc34a" stroke-width="3" stroke-linecap="round"/><circle cx="48" cy="29" r="3.6" fill="#c5e89a"/><circle cx="54" cy="27" r="3.6" fill="#c5e89a"/><circle cx="48" cy="29" r="1.6" fill="#173a4d"/><circle cx="54" cy="27" r="1.6" fill="#173a4d"/><circle cx="26" cy="34" r="17" fill="#e8975a"/><circle cx="26" cy="34" r="11.5" fill="#f4b183"/><circle cx="26" cy="34" r="6" fill="#c96f2e"/><circle cx="26" cy="34" r="17" fill="none" stroke="#c96f2e" stroke-width="2.5"/></svg>',
    shrimp: '<svg viewBox="0 0 64 64"><path d="M14 14 q26-6 34 14 q5 14-6 24 q-4 3-7-1 q-2-3 1-6 q7-7 4-15" fill="none" stroke="#ff9d9d" stroke-width="11" stroke-linecap="round"/><path d="M20 12 q4 6 3 12 M30 9 q4 6 3 13 M40 13 q4 6 2 12" stroke="#e86a6a" stroke-width="2.5" fill="none"/><path d="M12 12 L4 4 M16 10 L12 1" stroke="#e86a6a" stroke-width="2.2" stroke-linecap="round"/><circle cx="13" cy="15" r="2.4" fill="#173a4d"/><path d="M40 48 l10 6 M42 44 l12 2" stroke="#ff9d9d" stroke-width="4" stroke-linecap="round"/></svg>',
    ladybug: '<svg viewBox="0 0 64 64"><path d="M32 14 a20 20 0 0 1 0 40 a20 20 0 0 1 0-40z" fill="#ef3e36"/><path d="M32 14 v40" stroke="#263238" stroke-width="3"/><circle cx="32" cy="12" r="8" fill="#263238"/><circle cx="22" cy="28" r="3.4" fill="#263238"/><circle cx="43" cy="26" r="3" fill="#263238"/><circle cx="24" cy="43" r="3" fill="#263238"/><circle cx="42" cy="41" r="3.4" fill="#263238"/><circle cx="29" cy="34" r="2.2" fill="#263238"/><path d="M27 6 q-4-4-8-4 M37 6 q4-4 8-4" stroke="#263238" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M13 30 l-6-2 M13 44 l-6 3 M51 30 l6-2 M51 44 l6 3" stroke="#263238" stroke-width="2.6" stroke-linecap="round"/></svg>'
  };

  var ANIMALS = [
    { id:"bird",     name:"小鸟",   spots:[[22,10],[58,7],[38,25],[70,19]] },
    { id:"butterfly",name:"蝴蝶",   spots:[[30,21],[66,30],[48,17],[80,37]] },
    { id:"snail",    name:"蜗牛",   spots:[[17,37],[55,41],[74,23],[36,32]] },
    { id:"ladybug",  name:"瓢虫",   spots:[[85,29],[26,29],[60,35],[44,43]] },
    { id:"frog",     name:"青蛙",   spots:[[20,45],[50,46],[78,43],[34,51]] },
    { id:"duck",     name:"小鸭子", spots:[[30,55],[62,52],[45,60],[80,56]] },
    { id:"turtle",   name:"小乌龟", spots:[[68,63],[24,64],[52,56],[86,67]] },
    { id:"fish",     name:"小鱼",   spots:[[38,69],[70,73],[20,75],[56,81]] },
    { id:"shrimp",   name:"小虾",   spots:[[82,79],[30,83],[60,69],[44,89]] },
    { id:"crab",     name:"螃蟹",   spots:[[18,89],[74,91],[48,95],[88,85]] }
  ];

  /* ============ Sound (WebAudio, created on first tap) ============ */
  var actx = null;
  function audio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    }
    if(actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, t0, dur, type, vol){
    var ac = audio(); if(!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    var start = ac.currentTime + t0;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol || 0.22, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }
  function sndFind(){ tone(1318, 0, 0.18, "sine", 0.25); tone(1760, 0.09, 0.28, "sine", 0.25); }
  function sndRipple(){ tone(420, 0, 0.16, "sine", 0.10); }
  function sndHint(){ tone(1568, 0, 0.15, "triangle", 0.18); tone(2093, 0.1, 0.2, "triangle", 0.18); }
  function sndWin(){ [523,659,784,1046,784,1046,1318].forEach(function(f,i){ tone(f, i*0.13, 0.3, "triangle", 0.22); }); }

  /* ============ DOM refs ============ */
  var frame = document.getElementById("frame");
  var layer = document.getElementById("zoomLayer");
  var album = document.getElementById("album");
  var foundCountEl = document.getElementById("foundCount");
  var timerEl = document.getElementById("timer");
  var hintBtn = document.getElementById("hintBtn");
  var toast = document.getElementById("toast");
  var startOverlay = document.getElementById("startOverlay");
  var winOverlay = document.getElementById("winOverlay");

  /* album slots + start-screen minis + win parade */
  var slotEls = {};
  ANIMALS.forEach(function(a){
    var s = document.createElement("div");
    s.className = "slot"; s.innerHTML = ART[a.id];
    s.setAttribute("aria-label", a.name);
    album.appendChild(s); slotEls[a.id] = s;
  });
  document.getElementById("miniAnimals").innerHTML =
    ANIMALS.map(function(a){ return ART[a.id]; }).join("");
  document.getElementById("parade").innerHTML =
    ANIMALS.map(function(a,i){
      return '<span style="display:inline-block;animation-delay:'+(i*0.09)+'s"></span>';
    }).join("");
  (function(){
    var spans = document.querySelectorAll("#parade span");
    ANIMALS.forEach(function(a,i){
      spans[i].innerHTML = ART[a.id];
      spans[i].firstChild.style.animationDelay = (i*0.09) + "s";
    });
  })();

  /* ============ Game state ============ */
  var found = {}, foundTotal = 0, hintsLeft = 3;
  var startTime = null, timerId = null, playing = false;
  var animalEls = {};

  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function fmtTimeCN(sec){
    var m = Math.floor(sec/60), s = sec % 60;
    return m > 0 ? (m + " 分 " + (s < 10 ? "0" : "") + s + " 秒") : (s + " 秒");
  }
  function tick(){
    if(!startTime) return;
    var sec = Math.floor((Date.now() - startTime)/1000);
    timerEl.textContent = "时间 " + fmtTime(sec);
  }

  function pickSpots(){
    var chosen = [];
    ANIMALS.forEach(function(a){
      var options = a.spots.slice();
      /* shuffle */
      for(var i = options.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = options[i]; options[i] = options[j]; options[j] = t;
      }
      var pick = options[0];
      for(var k = 0; k < options.length; k++){
        var c = options[k], ok = true;
        for(var n = 0; n < chosen.length; n++){
          var dx = c[0] - chosen[n][0], dy = c[1] - chosen[n][1];
          if(Math.sqrt(dx*dx + dy*dy) < 13){ ok = false; break; }
        }
        if(ok){ pick = c; break; }
      }
      chosen.push(pick); a.pos = pick;
    });
  }

  function buildAnimals(){
    ANIMALS.forEach(function(a){
      var old = animalEls[a.id];
      if(old) old.remove();
      var b = document.createElement("button");
      b.type = "button";
      b.className = "animal";
      b.style.left = a.pos[0] + "%";
      b.style.top = a.pos[1] + "%";
      b.setAttribute("aria-label", "藏着的小动物");
      b.innerHTML = ART[a.id];
      b.querySelector("svg").style.animationDelay = (Math.random() * 2) + "s";
      b.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(suppressClick()) return;
        onFound(a, b);
      });
      layer.appendChild(b);
      animalEls[a.id] = b;
    });
  }

  function showToast(text){
    toast.textContent = text;
    toast.classList.remove("show");
    void toast.offsetWidth;
    toast.classList.add("show");
  }

  function flyToAlbum(a, fromRect){
    var slot = slotEls[a.id];
    var r = slot.getBoundingClientRect();
    var flyer = document.createElement("div");
    flyer.className = "flyer";
    var size = Math.max(fromRect.width, 40);
    flyer.style.left = (fromRect.left + fromRect.width/2 - size/2) + "px";
    flyer.style.top = (fromRect.top + fromRect.height/2 - size/2) + "px";
    flyer.style.width = size + "px";
    flyer.style.height = size + "px";
    flyer.innerHTML = ART[a.id];
    document.body.appendChild(flyer);
    var dx = (r.left + r.width/2) - (fromRect.left + fromRect.width/2);
    var dy = (r.top + r.height/2) - (fromRect.top + fromRect.height/2);
    var targetScale = (r.width * 0.82) / size;
    var anim = flyer.animate([
      { transform: "translate(0,0) scale(1)", opacity: 1 },
      { transform: "translate(" + dx + "px," + dy + "px) scale(" + targetScale + ")", opacity: 1 }
    ], { duration: 550, easing: "cubic-bezier(.3,.7,.4,1)" });
    anim.onfinish = function(){
      flyer.remove();
      slot.classList.add("lit", "pop");
      setTimeout(function(){ slot.classList.remove("pop"); }, 550);
    };
  }

  function onFound(a, btn){
    if(!playing || found[a.id]) return;
    found[a.id] = true;
    foundTotal++;
    foundCountEl.textContent = foundTotal;
    sndFind();
    showToast("找到了：" + a.name + "！");
    var rect = btn.getBoundingClientRect();
    btn.classList.add("found");
    flyToAlbum(a, rect);
    setTimeout(function(){ btn.style.visibility = "hidden"; }, 480);
    if(foundTotal >= 10){
      playing = false;
      var sec = Math.floor((Date.now() - startTime)/1000);
      setTimeout(function(){
        document.getElementById("winTime").textContent = fmtTimeCN(sec);
        winOverlay.hidden = false;
        sndWin();
        sprinkleSparkles();
      }, 900);
    }
  }

  function sprinkleSparkles(){
    var card = winOverlay.querySelector(".card");
    for(var i = 0; i < 22; i++){
      var sp = document.createElement("span");
      sp.className = "sparkle";
      sp.style.left = (5 + Math.random() * 90) + "%";
      sp.style.top = (Math.random() * 30) + "%";
      sp.style.background = ["#ffd94d","#7fd8e8","#ff9ecb","#a8d86e"][i % 4];
      sp.style.animationDuration = (0.9 + Math.random() * 1.1) + "s";
      sp.style.animationDelay = (Math.random() * 0.7) + "s";
      card.appendChild(sp);
      (function(el){ setTimeout(function(){ el.remove(); }, 3200); })(sp);
    }
  }

  /* wrong tap -> ripple */
  frame.addEventListener("click", function(ev){
    if(!playing) return;
    if(suppressClick()) return;
    if(ev.target.closest && ev.target.closest(".animal")) return;
    /* layer coords in % of untransformed layer size */
    var lw = frame.clientWidth, lh = frame.clientHeight;
    var lx = (ev.clientX - frame.getBoundingClientRect().left - zoom.tx) / zoom.scale;
    var ly = (ev.clientY - frame.getBoundingClientRect().top - zoom.ty) / zoom.scale;
    var rip = document.createElement("div");
    rip.className = "ripple";
    rip.style.left = (lx / lw * 100) + "%";
    rip.style.top = (ly / lh * 100) + "%";
    layer.appendChild(rip);
    sndRipple();
    setTimeout(function(){ rip.remove(); }, 700);
  });

  /* ============ Hint ============ */
  hintBtn.addEventListener("click", function(){
    if(!playing || hintsLeft <= 0) return;
    var remaining = ANIMALS.filter(function(a){ return !found[a.id]; });
    if(!remaining.length) return;
    hintsLeft--;
    hintBtn.textContent = hintsLeft > 0 ? ("💡 提示 · 剩 " + hintsLeft + " 次") : "提示用完啦";
    if(hintsLeft <= 0) hintBtn.disabled = true;
    var a = remaining[Math.floor(Math.random() * remaining.length)];
    var el = animalEls[a.id];
    sndHint();
    showToast("仔细看，" + a.name + "在发光！");
    el.classList.remove("hinting");
    void el.offsetWidth;
    el.classList.add("hinting");
    setTimeout(function(){ el.classList.remove("hinting"); }, 1700);
    /* bring hinted animal into view if zoomed out of sight is overkill; ensure visible flash is big */
  });

  /* ============ Zoom & pan ============ */
  var zoom = { scale: 1, tx: 0, ty: 0 };
  function applyZoom(){
    layer.style.transform = "translate(" + zoom.tx + "px," + zoom.ty + "px) scale(" + zoom.scale + ")";
  }
  function clampZoom(){
    var w = frame.clientWidth, h = frame.clientHeight;
    var minTx = w * (1 - zoom.scale), minTy = h * (1 - zoom.scale);
    zoom.tx = Math.min(0, Math.max(minTx, zoom.tx));
    zoom.ty = Math.min(0, Math.max(minTy, zoom.ty));
  }
  function zoomTo(newScale, cx, cy){
    var rect = frame.getBoundingClientRect();
    var px = (cx == null ? rect.width / 2 : cx - rect.left);
    var py = (cy == null ? rect.height / 2 : cy - rect.top);
    var lx = (px - zoom.tx) / zoom.scale;
    var ly = (py - zoom.ty) / zoom.scale;
    zoom.scale = Math.min(3, Math.max(1, newScale));
    zoom.tx = px - lx * zoom.scale;
    zoom.ty = py - ly * zoom.scale;
    clampZoom(); applyZoom();
  }
  document.getElementById("zoomIn").addEventListener("click", function(){ zoomTo(zoom.scale * 1.4); });
  document.getElementById("zoomOut").addEventListener("click", function(){ zoomTo(zoom.scale / 1.4); });
  document.getElementById("zoomReset").addEventListener("click", function(){ zoom.scale = 1; zoom.tx = 0; zoom.ty = 0; applyZoom(); });

  var pointers = {};
  var downPos = null, movedFar = false, pinchDist = 0;
  function suppressClick(){ return movedFar; }

  frame.addEventListener("pointerdown", function(ev){
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    if(Object.keys(pointers).length === 1){
      downPos = { x: ev.clientX, y: ev.clientY };
      movedFar = false;
    }
    if(Object.keys(pointers).length === 2){
      var pts = Object.values(pointers);
      pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      movedFar = true;
    }
  });
  frame.addEventListener("pointermove", function(ev){
    if(!pointers[ev.pointerId]) return;
    var prev = pointers[ev.pointerId];
    var dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    if(downPos && Math.hypot(ev.clientX - downPos.x, ev.clientY - downPos.y) > 14) movedFar = true;
    var count = Object.keys(pointers).length;
    if(count === 2){
      var pts = Object.values(pointers);
      var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if(pinchDist > 0){
        var midX = (pts[0].x + pts[1].x) / 2, midY = (pts[0].y + pts[1].y) / 2;
        zoomTo(zoom.scale * (dist / pinchDist), midX, midY);
      }
      pinchDist = dist;
    } else if(count === 1 && movedFar && zoom.scale > 1){
      zoom.tx += dx; zoom.ty += dy;
      clampZoom(); applyZoom();
    }
  });
  function endPointer(ev){
    delete pointers[ev.pointerId];
    if(Object.keys(pointers).length === 0){
      setTimeout(function(){ movedFar = false; downPos = null; }, 50);
      pinchDist = 0;
    }
  }
  frame.addEventListener("pointerup", endPointer);
  frame.addEventListener("pointercancel", endPointer);
  frame.addEventListener("wheel", function(ev){
    ev.preventDefault();
    zoomTo(zoom.scale * (ev.deltaY < 0 ? 1.12 : 0.89), ev.clientX, ev.clientY);
  }, { passive: false });

  /* ============ Game flow ============ */
  function resetGame(){
    found = {}; foundTotal = 0; hintsLeft = 3;
    foundCountEl.textContent = "0";
    hintBtn.disabled = false;
    hintBtn.textContent = "💡 提示 · 剩 3 次";
    timerEl.textContent = "时间 0:00";
    ANIMALS.forEach(function(a){ slotEls[a.id].classList.remove("lit"); });
    zoom.scale = 1; zoom.tx = 0; zoom.ty = 0; applyZoom();
    pickSpots();
    buildAnimals();
  }
  function startGame(){
    audio(); /* unlock audio on user gesture */
    resetGame();
    startTime = Date.now();
    playing = true;
    if(timerId) clearInterval(timerId);
    timerId = setInterval(tick, 250);
    tick();
  }
  document.getElementById("startBtn").addEventListener("click", function(){
    startOverlay.hidden = true;
    startGame();
  });
  document.getElementById("againBtn").addEventListener("click", function(){
    winOverlay.hidden = true;
    startGame();
  });

  /* pre-build so the painting behind the start card already has animals peeking */
  pickSpots();
  buildAnimals();
})();
</script>
</body>
</html>
