  /* ---------- stage ---------- */
  .stage{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    height:100dvh; aspect-ratio:752/1072; max-width:100vw;
    overflow:hidden; background:#bfeee2;
    box-shadow:0 0 60px rgba(0,0,0,.45);
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  @media (max-aspect-ratio: 752/1072){
    .stage{ width:100vw; height:auto; }
  }
  .bg{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:block; pointer-events:none;
  }
  canvas#game{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ---------- cloud covering the watermark (top-right) ---------- */
  .cloud{
    position:absolute; top:1.2%; right:-2%;
    width:34%; height:7.5%; pointer-events:none; z-index:6;
    animation:drift 9s ease-in-out infinite alternate;
    filter:drop-shadow(0 4px 8px rgba(60,120,130,.18));
  }
  @keyframes drift{
    from{ transform:translateX(4%); }
    to{ transform:translateX(-7%); }
  }
  .cloud i{
    position:absolute; background:#fff; border-radius:50%;
  }
  .cloud i:nth-child(1){ width:46%; height:78%; left:6%;  bottom:0; }
  .cloud i:nth-child(2){ width:52%; height:100%; left:30%; bottom:0; }
  .cloud i:nth-child(3){ width:44%; height:72%; right:2%; bottom:0; }
  .cloud i:nth-child(4){ width:100%; height:52%; left:0; bottom:0; border-radius:999px;}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute; top:2.2%; left:4%; z-index:7;
    display:none; align-items:center; gap:.45em;
    background:rgba(255,253,244,.92); border:3px solid #fff;
    border-radius:999px; padding:.32em .8em .32em .55em;
    font-size:clamp(19px,5.6vw,27px); color:var(--deep);
    box-shadow:0 4px 14px rgba(20,66,79,.22);
  }
  .hud.on{ display:flex; }
  .hud .drop-ico{ font-size:1.05em; line-height:1; }
  .hud b{ min-width:1.6em; text-align:center; }
  .hud .goal{ font-size:.62em; opacity:.65; }
  .pbar{
    width:4.6em; height:.5em; border-radius:99px; background:#d9efe9; overflow:hidden;
  }
  .pbar i{ display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#37b6d9,#3ec6c6,#57d99a); transition:width .35s ease; }
  .sound-btn{
    position:absolute; top:2.2%; left:4%; z-index:8; display:none;
  }
  /* keep sound button below hud instead */
  .sound-btn{
    top:auto; bottom:2%; left:4%;
    width:48px; height:48px; border-radius:50%; border:3px solid #fff;
    background:rgba(255,253,244,.92); font-size:21px; cursor:pointer;
    box-shadow:0 4px 14px rgba(20,66,79,.22); align-items:center; justify-content:center;
  }
  .sound-btn.on{ display:flex; }

  .hint{
    position:absolute; left:50%; bottom:12.5%; transform:translateX(-50%);
    z-index:7; display:none; white-space:nowrap;
    background:rgba(20,66,79,.55); color:#fff;
    font-size:clamp(15px,4.4vw,20px); padding:.4em 1em; border-radius:999px;
    pointer-events:none; animation:hintfloat 2.2s ease-in-out infinite;
  }
  .hint.on{ display:block; }
  @keyframes hintfloat{ 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,-6px);} }

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center;
    padding:5.5% 7% 6%;
    text-align:center;
  }
  .overlay.hidden{ display:none; }

  /* intro */
  #intro{ background:linear-gradient(180deg, rgba(240,255,250,.25), rgba(240,255,250,0) 30%); }
  .replay{
    position:relative; flex:1 1 auto; min-height:0; align-self:center;
    aspect-ratio:752/1072; max-width:100%;
    border-radius:22px; overflow:hidden;
    border:5px solid #fff; box-shadow:0 10px 30px rgba(20,66,79,.28);
    background:#eafaf3;
  }
  .replay img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .45s ease;
  }
  .replay .mini-cloud{
    position:absolute; top:1%; right:0; width:31%; height:8.5%; z-index:2; pointer-events:none;
  }
  .replay .mini-cloud i{ position:absolute; background:#fff; border-radius:50%; }
  .replay .mini-cloud i:nth-child(1){ width:46%; height:78%; left:6%; bottom:0; }
  .replay .mini-cloud i:nth-child(2){ width:52%; height:100%; left:30%; bottom:0; }
  .replay .mini-cloud i:nth-child(3){ width:44%; height:72%; right:2%; bottom:0; }
  .replay .mini-cloud i:nth-child(4){ width:100%; height:52%; left:0; bottom:0; border-radius:999px; }
  .replay img.cur{ opacity:1; }
  .replay .tag{
    position:absolute; left:10px; bottom:10px; z-index:2;
    background:rgba(20,66,79,.6); color:#fff; border-radius:999px;
    font-size:clamp(13px,3.8vw,16px); padding:.3em .9em;
  }
  h1.title{
    margin:.45em 0 .1em; font-weight:400; white-space:nowrap;
    font-size:clamp(28px,8.2vw,50px); color:#fff;
    text-shadow:0 3px 0 var(--teal), 0 8px 22px rgba(20,66,79,.45);
    letter-spacing:.04em;
  }
  .subtitle{
    margin:0 0 .7em; font-size:clamp(17px,5vw,23px); color:#eafff5;
    text-shadow:0 2px 10px rgba(20,66,79,.6);
  }
  .credit{
    margin-top:.65em; font-size:clamp(14px,4.2vw,18px); color:#eafff5;
    text-shadow:0 2px 8px rgba(20,66,79,.65);
  }
  .big-btn{
    font-family:inherit; cursor:pointer; border:none;
    font-size:clamp(26px,8vw,38px); color:#fff; letter-spacing:.06em;
    background:linear-gradient(180deg,#ffb62e,#ff8a3c);
    border-radius:999px; padding:.42em 1.5em .5em;
    box-shadow:0 6px 0 #d96f1e, 0 14px 28px rgba(20,66,79,.35);
    transition:transform .12s ease, box-shadow .12s ease;
    min-height:64px;
  }
  .big-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #d96f1e, 0 8px 18px rgba(20,66,79,.3); }
  .big-btn.green{
    background:linear-gradient(180deg,#3ec98f,#1fae74);
    box-shadow:0 6px 0 #147a50, 0 14px 28px rgba(20,66,79,.35);
  }
  .big-btn.green:active{ box-shadow:0 2px 0 #147a50, 0 8px 18px rgba(20,66,79,.3); }

  /* win */
  #win{ justify-content:flex-end; pointer-events:none; }
  #win .panel{ pointer-events:auto; }
  .panel{
    background:rgba(255,253,244,.96); border:4px solid #fff;
    border-radius:26px; padding:1em 1.2em 1.15em; width:100%;
    box-shadow:0 14px 34px rgba(20,66,79,.3);
  }
  .panel h2{
    margin:.1em 0 .25em; font-weight:400; color:var(--deep);
    font-size:clamp(26px,7.6vw,38px); line-height:1.25;
  }
  .panel p{ margin:.2em 0 .8em; font-size:clamp(16px,4.8vw,21px); color:#3a7182; }
  .panel .stars{ font-size:clamp(22px,6.5vw,30px); letter-spacing:.3em; margin-bottom:.15em; }

  /* rainbow + sun on win */
  .rainbow-wrap{
    position:absolute; left:50%; top:16%; width:118%; aspect-ratio:2/1;
    transform:translateX(-50%) scale(.6); opacity:0; z-index:5; pointer-events:none;
  }
  .rainbow-wrap.show{ animation:rainbowIn 1.4s ease forwards; }
  @keyframes rainbowIn{ to{ transform:translateX(-50%) scale(1); opacity:1; } }
  .sun{
    position:absolute; top:6.5%; left:8%; width:19%; aspect-ratio:1; z-index:5;
    pointer-events:none; opacity:0; transform:scale(.4) rotate(-30deg);
  }
  .sun.show{ animation:sunIn 1.1s .35s ease forwards; }
  @keyframes sunIn{ to{ opacity:1; transform:scale(1) rotate(0deg);} }
  .sun .core{
    position:absolute; inset:22%; border-radius:50%;
    background:radial-gradient(circle at 40% 38%, #ffe98a, #ffc93c 65%, #ffb62e);
    box-shadow:0 0 34px 10px rgba(255,205,60,.65);
  }
  .sun .ray{ position:absolute; left:50%; top:50%; width:7%; height:24%;
    background:#ffcf4d; border-radius:99px; transform-origin:50% 0; }
</style>
</head>

  }

  /* ---------- sun rays ---------- */
  (function(){
    for (var i = 0; i < 8; i++){
      var ray = document.createElement('div');
      ray.className = 'ray';
      ray.style.transform = 'rotate(' + (i * 45) + 'deg) translateY(190%)';
      sun.appendChild(ray);
    }
  })();

  /* ---------- intro slideshow ---------- */
  var frames = document.querySelectorAll('#replay img');
  var fi = 0, slideTimer = null;
  function showFrame(i){
    for (var k = 0; k < frames.length; k++) frames[k].classList.toggle('cur', k === i);
  }
  function startSlides(){
    showFrame(0); fi = 0;
    stopSlides();
    slideTimer = setInterval(function(){
      fi = fi + 1;
      if (fi >= frames.length) { stopSlides(); showFrame(frames.length - 1); return; }
      showFrame(fi);
    }, 700);
  }
  function stopSlides(){ if (slideTimer){ clearInterval(slideTimer); slideTimer = null; } }

  /* ---------- audio (synthesized, no files) ---------- */
  var AC = null, soundOn = true;
  function audio(){
    if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(freq, t0, dur, type, vol, slideTo){
    if (!soundOn) return;
    var ac = audio(); if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    var t = ac.currentTime + t0;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function pling(star){
    if (star){ tone(880, 0, .18, 'sine', .20); tone(1174, .07, .2, 'sine', .20); tone(1568, .14, .34, 'sine', .18); }
    else { tone(1174, 0, .16, 'sine', .16, 1568); tone(1760, .05, .22, 'triangle', .10); }
  }
  function fanfare(){
    var notes = [523, 659, 784, 1046, 784, 1046, 1318];
    for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.13, .3, 'triangle', .16);
  }
  soundBtn.addEventListener('click', function(e){
    e.stopPropagation();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) pling(false);
  });

  /* ---------- game state ---------- */
  var playing = false, won = false;
  var score = 0;
  var boat = { x: 0, targetX: 0, w: 92, bob: 0, tilt: 0, lastX: 0 };
  var drops = [], ripples = [], sparks = [], floats = [];
  var spawnT = 0, lastTime = 0, keys = { left: false, right: false };
  var interacted = false;

  function boatY(){ return H * 0.715 + Math.sin(boat.bob) * H * 0.006; }

  function resetGame(){
    score = 0; won = false;
    drops = []; ripples = []; sparks = []; floats = [];
    boat.x = W / 2; boat.targetX = W / 2; boat.lastX = W / 2;
    spawnT = 0.4;
    updateScore();
  }
  function updateScore(){
    scoreNum.textContent = score;
    pfill.style.width = Math.min(100, score / GOAL * 100) + '%';
  }

  function spawnDrop(){
    var isStar = Math.random() < 0.13;
    drops.push({
      x: W * 0.08 + Math.random() * W * 0.84,
      y: -30,
      vy: H * (0.16 + Math.random() * 0.07),   /* slow fall, kid-friendly */
      sway: Math.random() * Math.PI * 2,
      swayAmp: 6 + Math.random() * 8,
      r: isStar ? W * 0.034 : W * 0.030,
      star: isStar,
      spin: Math.random() * Math.PI * 2
    });
  }

  function addRipple(x, y, big){
    ripples.push({ x: x, y: y, r: big ? 10 : 6, max: big ? W * 0.16 : W * 0.075, a: big ? .75 : .5 });
  }
  function addSparks(x, y, star){
    var n = star ? 14 : 9;
    for (var i = 0; i < n; i++){
      var a = -Math.PI * (0.15 + Math.random() * 0.7);
      var sp = 60 + Math.random() * 130;
      sparks.push({
        x: x, y: y, vx: Math.cos(a) * sp * (Math.random() < .5 ? -1 : 1) * Math.random(),
        vy: Math.sin(a) * sp - 40, life: 1,
        col: star ? '255,190,40' : '120,225,235', r: 2 + Math.random() * 3
      });
    }
  }
  function addFloat(x, y, txt, col){
    floats.push({ x: x, y: y, txt: txt, col: col, life: 1 });
  }

  /* ---------- drawing helpers ---------- */
  function drawDrop(d){
    ctx.save();
    ctx.translate(d.x, d.y);
    /* glow */
    var g = ctx.createRadialGradient(0, 0, 2, 0, 0, d.r * 2.1);
    g.addColorStop(0, d.star ? 'rgba(255,205,60,.55)' : 'rgba(140,235,255,.55)');
    g.addColorStop(1, 'rgba(140,235,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, d.r * 2.1, 0, Math.PI * 2); ctx.fill();
    if (d.star){
      ctx.rotate(Math.sin(d.spin) * 0.25);
      ctx.fillStyle = '#ffbe28';
      ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (var i = 0; i < 5; i++){
        var a1 = -Math.PI / 2 + i * (Math.PI * 2 / 5);
        var a2 = a1 + Math.PI / 5;
        ctx.lineTo(Math.cos(a1) * d.r, Math.sin(a1) * d.r);
        ctx.lineTo(Math.cos(a2) * d.r * 0.48, Math.sin(a2) * d.r * 0.48);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = '#5fd4f2';
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -d.r * 1.25);
      ctx.bezierCurveTo(d.r * 0.85, -d.r * 0.1, d.r * 0.95, d.r * 0.35, d.r * 0.62, d.r * 0.78);
      ctx.bezierCurveTo(d.r * 0.3, d.r * 1.12, -d.r * 0.3, d.r * 1.12, -d.r * 0.62, d.r * 0.78);
      ctx.bezierCurveTo(-d.r * 0.95, d.r * 0.35, -d.r * 0.85, -d.r * 0.1, 0, -d.r * 1.25);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.ellipse(-d.r * 0.28, d.r * 0.25, d.r * 0.16, d.r * 0.26, 0.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawBoat(){
    var y = boatY();
    var bw = boat.w, bh = bw * 0.62;
    ctx.save();
    ctx.translate(boat.x, y);
    ctx.rotate(boat.tilt + Math.sin(boat.bob * 0.7) * 0.02);
    /* hull shadow on water */
    ctx.fillStyle = 'rgba(30,90,110,.18)';
    ctx.beginPath(); ctx.ellipse(0, bh * 0.52, bw * 0.52, bh * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    /* sail */
    ctx.fillStyle = '#fffdf4';
    ctx.strokeStyle = '#e8b04b'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-bw * 0.04, -bh * 0.95);
    ctx.quadraticCurveTo(bw * 0.34, -bh * 0.45, -bw * 0.04, -bh * 0.08);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-bw * 0.10, -bh * 0.88);
    ctx.quadraticCurveTo(-bw * 0.36, -bh * 0.45, -bw * 0.10, -bh * 0.08);
    ctx.closePath(); ctx.fillStyle = '#ffe9a8'; ctx.fill(); ctx.stroke();
    /* mast */
    ctx.strokeStyle = '#a9743a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-bw * 0.07, -bh * 1.0); ctx.lineTo(-bw * 0.07, bh * 0.1); ctx.stroke();
    /* flag */
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.moveTo(-bw * 0.07, -bh * 1.0);
    ctx.lineTo(bw * 0.16, -bh * 0.9);
    ctx.lineTo(-bw * 0.07, -bh * 0.8);
    ctx.closePath(); ctx.fill();
    /* paper hull */
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#7fb6c9'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-bw * 0.52, -bh * 0.05);
    ctx.lineTo(bw * 0.52, -bh * 0.05);
    ctx.lineTo(bw * 0.32, bh * 0.42);
    ctx.quadraticCurveTo(0, bh * 0.58, -bw * 0.32, bh * 0.42);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#bfe9f5';
    ctx.beginPath();
    ctx.moveTo(-bw * 0.52, -bh * 0.05); ctx.lineTo(bw * 0.52, -bh * 0.05);
    ctx.lineTo(bw * 0.44, bh * 0.13); ctx.lineTo(-bw * 0.44, bh * 0.13);
    ctx.closePath(); ctx.fill();
    /* fold line */
    ctx.strokeStyle = 'rgba(127,182,201,.7)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, -bh * 0.05); ctx.lineTo(0, bh * 0.44); ctx.stroke();
    ctx.restore();
  }

  /* ---------- main loop ---------- */
  function loop(ts){
    requestAnimationFrame(loop);
    if (!W) resize();
    var dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
    lastTime = ts;
    ctx.clearRect(0, 0, W, H);
    if (!playing) return;

    boat.bob += dt * 2.1;

    /* keyboard */
    var kSpeed = W * 0.85 * dt;
    if (keys.left) boat.targetX -= kSpeed;
    if (keys.right) boat.targetX += kSpeed;
    boat.targetX = Math.max(boat.w * 0.55, Math.min(W - boat.w * 0.55, boat.targetX));

    /* smooth follow */
    var prevX = boat.x;
    boat.x += (boat.targetX - boat.x) * Math.min(1, dt * 10);
    var vel = (boat.x - prevX) / Math.max(dt, 0.001);
    boat.tilt += ((Math.max(-0.09, Math.min(0.09, vel / W * 0.55))) - boat.tilt) * Math.min(1, dt * 8);

    /* moving ripples */
    if (Math.abs(vel) > W * 0.12 && Math.random() < 0.5) addRipple(boat.x - Math.sign(vel) * boat.w * 0.3, boatY() + boat.w * 0.3, false);

    /* spawn */
    if (!won){
      spawnT -= dt;
      if (spawnT <= 0 && drops.length < 4){ spawnDrop(); spawnT = 1.15 + Math.random() * 0.8; }
    }

    /* drops */
    var by = boatY();
    for (var i = drops.length - 1; i >= 0; i--){
      var d = drops[i];
      d.sway += dt * 1.6; d.spin += dt * 2;
      d.y += d.vy * dt;
      var dx = d.x + Math.sin(d.sway) * d.swayAmp;
      var caught = !won && d.y > by - boat.w * 0.52 && d.y < by + boat.w * 0.3 && Math.abs(dx - boat.x) < boat.w * 0.58;
      if (caught){
        var pts = d.star ? 3 : 1;
        score = Math.min(GOAL, score + pts);
        updateScore();
        pling(d.star);
        addRipple(boat.x, by + boat.w * 0.3, true);
        addSparks(dx, d.y, d.star);
        addFloat(dx, by - boat.w * 0.85, d.star ? '+3 ⭐' : '+1 💧', d.star ? '#e8930c' : '#1d7f9e');
        drops.splice(i, 1);
        if (score >= GOAL) doWin();
        continue;
      }
      if (d.y > H * 0.97){ /* missed: gentle ripple, no penalty */
        addRipple(dx, H * 0.96, false);
        drops.splice(i, 1); continue;
      }
      var drawD = { x: dx, y: d.y, r: d.r, star: d.star, spin: d.spin };
      drawDrop(drawD);
    }

    /* ripples */
    for (var j = ripples.length - 1; j >= 0; j--){
      var r = ripples[j];
      r.r += dt * W * 0.14;
      var p = r.r / r.max;
      if (p >= 1){ ripples.splice(j, 1); continue; }
      ctx.strokeStyle = 'rgba(255,255,255,' + (r.a * (1 - p)).toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.32, 0, 0, Math.PI * 2); ctx.stroke();
    }
    /* sparks */
    for (var s = sparks.length - 1; s >= 0; s--){
      var sp = sparks[s];
      sp.life -= dt * 1.5;
      if (sp.life <= 0){ sparks.splice(s, 1); continue; }
      sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vy += 300 * dt;
      ctx.fillStyle = 'rgba(' + sp.col + ',' + sp.life.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
    }
    /* floating +1 */
    ctx.textAlign = 'center';
    for (var f = floats.length - 1; f >= 0; f--){
      var fl = floats[f];
      fl.life -= dt * 0.9; fl.y -= dt * 42;
      if (fl.life <= 0){ floats.splice(f, 1); continue; }
      ctx.font = '700 ' + Math.round(W * 0.062) + 'px "ZCOOL KuaiLe","PingFang SC",sans-serif';
      ctx.globalAlpha = Math.min(1, fl.life * 1.6);
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.strokeText(fl.txt, fl.x, fl.y);
      ctx.fillStyle = fl.col; ctx.fillText(fl.txt, fl.x, fl.y);
      ctx.globalAlpha = 1;
    }

    drawBoat();
  }
  requestAnimationFrame(loop);

  function doWin(){
    won = true;
    drops = [];
    fanfare();
    for (var i = 0; i < 26; i++){
      (function(n){
        setTimeout(function(){
          addSparks(W * (0.15 + Math.random() * 0.7), H * (0.3 + Math.random() * 0.3), Math.random() < .4);
        }, n * 90);
      })(i);
    }
    rainbow.classList.add('show');
    sun.classList.add('show');
    setTimeout(function(){ winEl.classList.remove('hidden'); }, 900);
  }

  /* ---------- input ---------- */
  function pointerX(clientX){
    var r = stage.getBoundingClientRect();
    return clientX - r.left;
  }
  var dragging = false;
  stage.addEventListener('pointerdown', function(e){
    if (e.target.closest('button') || e.target.closest('.overlay')) return;
    dragging = true; interacted = true;
    boat.targetX = pointerX(e.clientX);
    audio();
    hint.classList.remove('on');
  });
  window.addEventListener('pointermove', function(e){
    if (!dragging || !playing) return;
    boat.targetX = pointerX(e.clientX);
  });
  window.addEventListener('pointerup', function(){ dragging = false; });
  window.addEventListener('pointercancel', function(){ dragging = false; });
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft'){ keys.left = true; interacted = true; hint.classList.remove('on'); }
    if (e.key === 'ArrowRight'){ keys.right = true; interacted = true; hint.classList.remove('on'); }
  });
  window.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  /* ---------- flow ---------- */
  document.getElementById('startBtn').addEventListener('click', function(){
    audio(); pling(false);
    stopSlides();
    intro.classList.add('hidden');
    hud.classList.add('on');
    soundBtn.classList.add('on');
    resize();
    resetGame();
    playing = true;
    hint.classList.add('on');
    setTimeout(function(){ hint.classList.remove('on'); }, 5000);
  });
  document.getElementById('againBtn').addEventListener('click', function(){
    audio(); pling(false);
    winEl.classList.add('hidden');
    rainbow.classList.remove('show');
    sun.classList.remove('show');
    resetGame();
    playing = true;
  });

  resize();
  startSlides();
})();
</script>
</body>
</html>
