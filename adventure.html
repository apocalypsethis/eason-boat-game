<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Eason 的山湖大冒险</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #14405e;
        --ink-soft: #2c6a8f;
        --paper: #fffdf6;
        --gold: #ffb703;
        --coral: #ff6b6b;
        --teal: #0e7c86;
        --shadow: 0 6px 24px rgba(10, 50, 80, .28);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: #7ec8e3;
        overflow: hidden;
      }
      button { font-family: inherit; cursor: pointer; }

      /* ---------- stage ---------- */
      #stage {
        position: fixed; inset: 0;
        overflow: hidden;
        background: #7ec8e3;
      }
      #game {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        display: block;
        touch-action: none;
      }

      /* ---------- HUD ---------- */
      #hud {
        position: absolute; left: 0; right: 0; top: 0;
        padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 8px;
        display: flex; align-items: flex-start; gap: 8px;
        pointer-events: none;
        z-index: 5;
        opacity: 0; transition: opacity .3s;
      }
      #hud.on { opacity: 1; }
      .hud-pill {
        background: rgba(255, 253, 246, .92);
        border-radius: 999px;
        box-shadow: 0 3px 10px rgba(10, 50, 80, .18);
        padding: 6px 11px;
        font-size: 16px;
        line-height: 1.15;
        white-space: nowrap;
      }
      #levelName { color: var(--ink); }
      #starPill { color: #b97a00; }
      #hearts { font-size: 16px; letter-spacing: 1px; padding: 6px 10px; }
      #cornerBtns {
        position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 58px);
        display: flex; gap: 8px; z-index: 6;
      }
      .icon-btn {
        pointer-events: auto;
        width: 46px; height: 46px; min-height: 46px;
        border: none; border-radius: 50%;
        background: rgba(255, 253, 246, .92);
        box-shadow: 0 3px 10px rgba(10, 50, 80, .18);
        font-size: 21px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        color: var(--ink);
      }
      .icon-btn:active { transform: scale(.92); }

      /* wind hint ribbon */
      #windTag {
        position: absolute; top: calc(env(safe-area-inset-top, 0px) + 114px); left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 64, 94, .55); color: #fff;
        padding: 5px 16px; border-radius: 999px; font-size: 16px;
        opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 5;
        white-space: nowrap;
      }
      #windTag.on { opacity: 1; }

      /* ---------- overlays ---------- */
      .overlay {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        background: linear-gradient(180deg, rgba(126,200,227,.25), rgba(20,64,94,.38));
      }
      .overlay.hidden { display: none; }
      .card {
        background: var(--paper);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 30px 30px 26px;
        max-width: 430px; width: 100%;
        border: 4px solid #fff;
      }
      h1.title {
        margin: 0 0 6px;
        font-size: clamp(38px, 10vw, 54px);
        line-height: 1.15;
        color: var(--ink);
        letter-spacing: 1px;
      }
      .title .accent { color: var(--teal); }
      .subtitle { font-size: clamp(19px, 5.4vw, 24px); color: var(--ink-soft); margin: 6px 0 4px; line-height: 1.45; }
      .howto {
        margin: 14px auto 4px; text-align: left; display: inline-block;
        font-size: 18px; line-height: 1.75; color: var(--ink);
      }
      .howto b { color: var(--teal); }
      .big-btn {
        margin-top: 20px;
        border: none; border-radius: 999px;
        background: linear-gradient(180deg, #ffb703, #fb8500);
        color: #fff; font-size: 27px; letter-spacing: 2px;
        padding: 15px 44px; min-height: 60px;
        box-shadow: 0 6px 0 #c96a00, 0 12px 22px rgba(160, 90, 0, .35);
        text-shadow: 0 2px 3px rgba(120, 60, 0, .35);
      }
      .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c96a00, 0 6px 12px rgba(160,90,0,.3); }
      .ghost-btn {
        margin-top: 14px;
        border: 3px solid var(--teal); border-radius: 999px;
        background: #fff; color: var(--teal);
        font-size: 21px; padding: 10px 34px; min-height: 52px;
      }
      .ghost-btn:active { transform: scale(.95); }
      .credit { margin-top: 18px; font-size: 16px; color: rgba(255,255,255,.95); text-shadow: 0 1px 4px rgba(10,50,80,.5); }
      .card .credit { color: var(--ink-soft); text-shadow: none; }
      .emoji-big { font-size: 58px; line-height: 1.1; }
      .win-time { font-size: 24px; color: #b97a00; margin-top: 8px; }
      .level-dots { font-size: 22px; letter-spacing: 6px; margin-top: 10px; }

      /* level intro banner */
      #banner {
        position: absolute; inset: 0; z-index: 8;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        pointer-events: none; text-align: center; padding: 24px;
      }
      #banner.hidden { display: none; }
      #banner .b-card {
        background: rgba(255, 253, 246, .94);
        border-radius: 26px; padding: 22px 38px;
        box-shadow: var(--shadow);
        animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
      }
      #banner .b-level { font-size: clamp(34px, 9vw, 46px); color: var(--ink); }
      #banner .b-sub { font-size: 20px; color: var(--ink-soft); margin-top: 4px; }
      @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      /* toast for level clear */
      #toast {
        position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.7);
        z-index: 8; font-size: clamp(40px, 11vw, 58px); color: #fff;
        text-shadow: 0 3px 0 #e08a00, 0 8px 24px rgba(120,60,0,.45);
        opacity: 0; pointer-events: none; white-space: nowrap;
      }
      #toast.show { animation: toastpop 1.5s ease forwards; }
      @keyframes toastpop {
        0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
        18% { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
        30% { transform: translate(-50%,-50%) scale(1); }
        78% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%,-58%) scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        #banner .b-card, #toast.show { animation: none; }
        #toast.show { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- HUD -->
      <div id="hud">
        <div class="hud-pill" id="levelName">第 1 关</div>
        <div class="hud-pill" id="starPill">⭐ 0 / 8</div>
        <div class="hud-pill" id="hearts">❤️❤️❤️</div>
      </div>
      <div id="cornerBtns">
        <button class="icon-btn" id="muteBtn" aria-label="静音开关">🔊</button>
        <button class="icon-btn" id="pauseBtn" aria-label="暂停">⏸️</button>
      </div>
      <div id="windTag">💨 风来啦，扶稳小船！</div>

      <!-- level intro banner -->
      <div id="banner" class="hidden">
        <div class="b-card">
          <div class="b-level" id="bannerTitle">第 1 关</div>
          <div class="b-sub" id="bannerSub">平静湖面</div>
        </div>
      </div>
      <div id="toast"></div>

      <!-- start screen -->
      <div class="overlay" id="startScreen">
        <div class="card">
          <div class="emoji-big">⛵</div>
          <h1 class="title">Eason 的<br /><span class="accent">山湖大冒险</span></h1>
          <p class="subtitle">开船过关，收集星星 ⭐<br />最后一关是台风！</p>
          <div class="howto">
            👆 <b>拖动小船</b>左右跑（键盘方向键也行）<br />
            ⭐ 接住 <b>8 颗星星</b>就能过关<br />
            🪨 躲开<b>礁石和浪头</b>，小心你的 ❤️
          </div>
          <br />
          <button class="big-btn" id="startBtn">开始冒险</button>
          <div class="credit">画作：Eason（7岁）</div>
        </div>
      </div>

      <!-- pause -->
      <div class="overlay hidden" id="pauseScreen">
        <div class="card">
          <div class="emoji-big">⏸️</div>
          <h1 class="title" style="font-size:40px;">休息一下</h1>
          <p class="subtitle">小船停在湖面上等你</p>
          <button class="big-btn" id="resumeBtn">继续航行</button>
          <br />
          <button class="ghost-btn" id="restartBtn">从头开始</button>
        </div>
      </div>

      <!-- game over -->
      <div class="overlay hidden" id="overScreen">
        <div class="card">
          <div class="emoji-big">🛶</div>
          <h1 class="title" style="font-size:42px;">船翻啦，再试一次</h1>
          <p class="subtitle" id="overText">别灰心，船长都是练出来的！</p>
          <button class="big-btn" id="retryBtn">重开本关</button>
          <div class="credit">画作：Eason（7岁）</div>
        </div>
      </div>

      <!-- win -->
      <div class="overlay hidden" id="winScreen" style="background: linear-gradient(180deg, rgba(126,200,227,.12), rgba(20,64,94,.25));">
        <div class="card">
          <div class="emoji-big">🏆</div>
          <h1 class="title" style="font-size:40px;">你征服了<br />Eason 的山湖！</h1>
          <div class="level-dots">⭐⭐⭐</div>
          <div class="win-time" id="winTime">总用时 0 秒</div>
          <p class="subtitle">连台风都难不倒你，真了不起！</p>
          <button class="big-btn" id="againBtn">再玩一次</button>
          <div class="credit">画作：Eason（7岁）</div>
        </div>
      </div>
    </div>

      var view = { w: 0, h: 0, dpr: 1, scale: 1, ox: 0, oy: 0, pw: 0, ph: 0 };
      function resize() {
        view.dpr = Math.min(window.devicePixelRatio || 1, 2);
        view.w = window.innerWidth; view.h = window.innerHeight;
        canvas.width = Math.round(view.w * view.dpr);
        canvas.height = Math.round(view.h * view.dpr);
        view.scale = Math.max(view.w / IMG_W, view.h / IMG_H);
        view.pw = IMG_W * view.scale; view.ph = IMG_H * view.scale;
        view.ox = (view.w - view.pw) / 2; view.oy = (view.h - view.ph) / 2;
      }
      window.addEventListener('resize', resize);
      resize();

      function PX(u) { return view.ox + u * view.pw; }
      function PY(v) { return view.oy + v * view.ph; }
      function toPainting(cx, cy) {
        return { x: (cx - view.ox) / view.pw, y: (cy - view.oy) / view.ph };
      }
      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

      /* ---------------- audio (synth) ---------------- */
      var AC = null, muted = false;
      function ac() {
        if (!AC) {
          try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
        }
        if (AC && AC.state === 'suspended') AC.resume();
        return AC;
      }
      function tone(freq, t0, dur, type, vol, slideTo) {
        var a = ac(); if (!a || muted) return;
        var o = a.createOscillator(), g = a.createGain();
        var start = a.currentTime + t0;
        o.type = type; o.frequency.setValueAtTime(freq, start);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        o.connect(g); g.connect(a.destination);
        o.start(start); o.stop(start + dur + 0.05);
      }
      function sfxStar()  { tone(1318, 0, 0.12, 'sine', 0.22); tone(1760, 0.07, 0.18, 'sine', 0.22); }
      function sfxHit()   { tone(196, 0, 0.28, 'triangle', 0.32, 70); tone(98, 0.02, 0.3, 'sine', 0.3, 55); }
      function sfxClear() { var n = [523, 659, 784, 1047]; for (var i = 0; i < n.length; i++) tone(n[i], i * 0.11, 0.22, 'triangle', 0.24); }
      function sfxWin()   { var n = [523, 659, 784, 1047, 784, 1047, 1319]; for (var i = 0; i < n.length; i++) tone(n[i], i * 0.14, 0.3, 'triangle', 0.24); }
      function sfxClick() { tone(880, 0, 0.07, 'sine', 0.15); }

      var state = 'menu'; // menu | intro | playing | paused | over | win
      var level = 0;
      var boat = { x: 0.5, y: 0.78, tx: 0.5, ty: 0.78, vx: 0, tilt: 0 };
      var hearts = 3, starsGot = 0;

      var particles = []; // sparkles
      var raindrops = [];
      var windStreaks = [];
      var starTimer = 0.6, rockTimer = 2.2, waveTimer = 3.0;
      var invincible = 0;
      var totalTime = 0, introTimer = 0;

      var shake = 0;
      var keys = {};
      var lastTs = 0, elapsed = 0;

      var hud = document.getElementById('hud');
      var levelNameEl = document.getElementById('levelName');
      var starPillEl = document.getElementById('starPill');
      var heartsEl = document.getElementById('hearts');
      var windTag = document.getElementById('windTag');
      var banner = document.getElementById('banner');
      var bannerTitle = document.getElementById('bannerTitle');
      var bannerSub = document.getElementById('bannerSub');
      var toast = document.getElementById('toast');

      function show(id) { document.getElementById(id).classList.remove('hidden'); }
      function hide(id) { document.getElementById(id).classList.add('hidden'); }

      function updateHUD() {
        levelNameEl.textContent = LEVELS[level].name + ' · ' + LEVELS[level].sub;
        starPillEl.textContent = '⭐ ' + starsGot + ' / ' + TARGET_STARS;
        var h = '';
        for (var i = 0; i < 3; i++) h += i < hearts ? '❤️' : '🩶';
        heartsEl.textContent = h;
      }

      function resetLevel(lv) {
        level = lv;
        hearts = 3; starsGot = 0;
        entities = []; particles = [];
        boat.x = 0.5; boat.y = 0.78; boat.tx = 0.5; boat.ty = 0.78; boat.vx = 0; boat.tilt = 0;
        starTimer = 0.7; rockTimer = 2.4; waveTimer = 3.2;
        invincible = 0; shake = 0; windNow = 0;
        raindrops = []; windStreaks = [];
        updateHUD();
      }

      function startLevel(lv) {
        resetLevel(lv);
        bannerTitle.textContent = LEVELS[lv].name;
        bannerSub.textContent = LEVELS[lv].sub + ' · 收集 ' + TARGET_STARS + ' 颗星星';
        banner.classList.remove('hidden');
        state = 'intro'; introTimer = 1.5;
        hud.classList.add('on');
      }

      function startGame() {
        totalTime = 0;
        hide('startScreen'); hide('overScreen'); hide('winScreen'); hide('pauseScreen');
        startLevel(0);
      }

      function levelCleared() {
        sfxClear();
        toast.textContent = level === LEVELS.length - 1 ? '通关啦！🎉' : '过关啦！🎉';
        toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
        entities = [];
        setTimeout(function () {
          if (state !== 'clearing') return;
          if (level >= LEVELS.length - 1) {
            winGame();
          } else {
            startLevel(level + 1);
          }
        }, 1500);
        state = 'clearing';
      }

      function winGame() {
        state = 'win';
        sfxWin();
        var s = Math.round(totalTime);
        var txt = s >= 60 ? ('总用时 ' + Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒') : ('总用时 ' + s + ' 秒');
        document.getElementById('winTime').textContent = txt;
        show('winScreen');
      }

      function gameOver() {
        state = 'over';
        document.getElementById('overText').textContent =
          '你在「' + LEVELS[level].sub + '」收集了 ' + starsGot + ' 颗星星，就差一点点！';
        show('overScreen');
      }

      function hitObstacle() {
        if (invincible > 0 || state !== 'playing') return;
        hearts--; invincible = 1.6; shake = 0.35;
        sfxHit();
        updateHUD();
        if (hearts <= 0) { setTimeout(gameOver, 450); state = 'dying'; }
      }

      /* ---------------- spawning ---------------- */
      function spawn(kind) {
        var r = kind === 'star' ? 0.034 : (kind === 'rock' ? 0.046 : 0.052);
        entities.push({
          kind: kind,
          x: 0.08 + Math.random() * 0.84,
          y: LAKE_TOP - 0.03,
          r: r,
          spin: Math.random() * Math.PI * 2,
          wob: Math.random() * Math.PI * 2,
          seed: Math.random() * 1000
        });
      }

      /* ---------------- input ---------------- */
      var pointerDown = false;
      function setTarget(cx, cy) {
        var p = toPainting(cx, cy);
        boat.tx = clamp(p.x, 0.07, 0.93);
        boat.ty = clamp(p.y, LAKE_TOP + 0.03, LAKE_BOT);
      }
      canvas.addEventListener('pointerdown', function (e) {
        pointerDown = true; ac(); setTarget(e.clientX, e.clientY);
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', function (e) {
        if (pointerDown) setTarget(e.clientX, e.clientY);
      });
      canvas.addEventListener('pointerup', function () { pointerDown = false; });
      canvas.addEventListener('pointercancel', function () { pointerDown = false; });
      window.addEventListener('keydown', function (e) {
        keys[e.key] = true;
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].indexOf(e.key) >= 0) e.preventDefault();
      });
      window.addEventListener('keyup', function (e) { keys[e.key] = false; });

      /* ---------------- update ---------------- */
      function update(dt) {
        elapsed += dt;
        if (state === 'intro') {
          introTimer -= dt;
          if (introTimer <= 0) { banner.classList.add('hidden'); state = 'playing'; }
          return;
        }
        if (state !== 'playing' && state !== 'clearing' && state !== 'dying') return;
        if (state === 'playing') totalTime += dt;
        var L = LEVELS[level];

        /* wind: gusts come and go */
        windPhase += dt;
        if (L.wind > 0) {
          gustTimer -= dt;
          if (gustTimer <= 0) {
            gustTimer = 1.6 + Math.random() * 2.2;
            var dir = Math.random() < 0.5 ? -1 : 1;
            windNow = dir * L.wind * (0.5 + Math.random() * 0.7);
            if (state === 'playing') {
              windTag.textContent = windNow > 0 ? '💨 大风往右吹，扶稳小船！' : '💨 大风往左吹，扶稳小船！';
              windTag.classList.add('on');
              setTimeout(function () { windTag.classList.remove('on'); }, 1500);
            }
          }
        } else windNow = 0;

        /* boat movement */
        var kSpeed = 0.55; // painting-widths per second
        if (keys['ArrowLeft'] || keys['a']) boat.tx = clamp(boat.tx - kSpeed * dt, 0.07, 0.93);
        if (keys['ArrowRight'] || keys['d']) boat.tx = clamp(boat.tx + kSpeed * dt, 0.07, 0.93);
        if (keys['ArrowUp'] || keys['w']) boat.ty = clamp(boat.ty - kSpeed * 0.7 * dt, LAKE_TOP + 0.03, LAKE_BOT);
        if (keys['ArrowDown'] || keys['s']) boat.ty = clamp(boat.ty + kSpeed * 0.7 * dt, LAKE_TOP + 0.03, LAKE_BOT);

        var prevX = boat.x;
        var follow = 1 - Math.pow(0.0001, dt); // smooth follow
        boat.x += (boat.tx - boat.x) * follow;
        boat.y += (boat.ty - boat.y) * follow;
        boat.x += windNow * 0.16 * dt; // wind pushes the boat
        boat.x = clamp(boat.x, 0.06, 0.94);
        boat.vx = (boat.x - prevX) / Math.max(dt, 0.001);
        var rockAmt = L.rain ? Math.sin(elapsed * 5.2) * 0.06 : Math.sin(elapsed * 2.2) * 0.02;
        boat.tilt += ((clamp(boat.vx * 0.10, -0.16, 0.16) + rockAmt) - boat.tilt) * Math.min(1, dt * 8);

        if (invincible > 0) invincible -= dt;
        if (shake > 0) shake -= dt;

        if (state !== 'playing') return;

        /* spawning */
        starTimer -= dt; rockTimer -= dt; waveTimer -= dt;
        if (starTimer <= 0) { spawn('star'); starTimer = L.starEvery * (0.75 + Math.random() * 0.5); }
        if (L.rockEvery > 0 && rockTimer <= 0) { spawn('rock'); rockTimer = L.rockEvery * (0.75 + Math.random() * 0.5); }
        if (L.waveEvery > 0 && waveTimer <= 0) { spawn('wave'); waveTimer = L.waveEvery * (0.75 + Math.random() * 0.5); }

        /* entities */
        var bx = PX(boat.x), by = PY(boat.y);
        var boatR = view.pw * 0.042;
        for (var i = entities.length - 1; i >= 0; i--) {
          var e = entities[i];
          e.y += L.fall * dt; // fall speed in painting-height units per second
          e.wob += dt * 2;
          e.x += Math.sin(e.wob) * 0.012 * dt * 8 * 0.125;
          if (L.wind > 0 && e.kind !== 'rock') e.x += windNow * 0.05 * dt;
          if (e.y > 1.02) { entities.splice(i, 1); continue; }
          var dx = PX(e.x) - bx, dy = PY(e.y) - by;
          var rr = view.pw * e.r + boatR * 0.82;
          if (dx * dx + dy * dy < rr * rr) {
            if (e.kind === 'star') {
              starsGot++; sfxStar();
              for (var j = 0; j < 8; j++) particles.push({ x: e.x, y: e.y, a: (j / 8) * Math.PI * 2, life: 0.45, sp: 0.10 + Math.random() * 0.08 });
              entities.splice(i, 1);
              updateHUD();
              if (starsGot >= TARGET_STARS) { levelCleared(); return; }
            } else {
              entities.splice(i, 1);
              hitObstacle();
              if (state !== 'playing') return;
            }
          }
        }

        /* particles */
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.life -= dt;
          pt.x += Math.cos(pt.a) * pt.sp * dt; pt.y += Math.sin(pt.a) * pt.sp * dt - 0.03 * dt;
          if (pt.life <= 0) particles.splice(p, 1);
        }

        /* rain (level 3) */
        if (L.rain) {
          for (var rI = 0; rI < 3; rI++) {
            if (raindrops.length < 130) raindrops.push({ x: Math.random() * 1.15 - 0.05, y: Math.random() * 0.2 - 0.1, sp: 0.9 + Math.random() * 0.5 });
          }
        }
        for (var r2 = raindrops.length - 1; r2 >= 0; r2--) {
          var rd = raindrops[r2];
          rd.y += rd.sp * dt; rd.x += (0.22 + windNow * 0.15) * dt;
          if (rd.y > 1.02 || rd.x > 1.05) raindrops.splice(r2, 1);
        }

        /* wind streaks */
        if (L.wind > 0 && Math.abs(windNow) > 0.25 && Math.random() < 0.35) {
          windStreaks.push({ x: windNow > 0 ? -0.05 : 1.05, y: 0.45 + Math.random() * 0.5, sp: windNow * 1.4, life: 1.2 });
        }
        for (var wI = windStreaks.length - 1; wI >= 0; wI--) {
          var ws = windStreaks[wI];
          ws.x += ws.sp * dt; ws.life -= dt;
          if (ws.life <= 0 || ws.x < -0.2 || ws.x > 1.2) windStreaks.splice(wI, 1);
        }
      }

      /* ---------------- drawing ---------------- */
      function drawCloud(cx, cy, s, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ffffff';
        var blobs = [[0, 0, 0.30], [-0.26, 0.05, 0.21], [0.26, 0.05, 0.22], [-0.10, -0.10, 0.22], [0.13, -0.08, 0.24], [0, 0.09, 0.27]];
        for (var i = 0; i < blobs.length; i++) {
          ctx.beginPath();
          ctx.arc(cx + blobs[i][0] * s, cy + blobs[i][1] * s, blobs[i][2] * s, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStar(cx, cy, r, rot) {
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(rot);
        ctx.shadowColor = 'rgba(255, 183, 3, .85)'; ctx.shadowBlur = r * 0.7;
        ctx.beginPath();
        for (var i = 0; i < 10; i++) {
          var rad = i % 2 === 0 ? r : r * 0.48;
          var a = (i / 10) * Math.PI * 2 - Math.PI / 2;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fillStyle = '#ffcf3f'; ctx.fill();
        ctx.shadowBlur = 0;
        ctx.lineWidth = r * 0.12; ctx.strokeStyle = '#e8930c'; ctx.stroke();
        ctx.restore();
      }

      function drawRock(cx, cy, r, seed) {
        ctx.save(); ctx.translate(cx, cy);
        ctx.beginPath();
        var n = 7;
        for (var i = 0; i <= n; i++) {
          var a = (i / n) * Math.PI * 2;
          var rad = r * (0.82 + 0.22 * Math.abs(Math.sin(seed + i * 2.3)));
          var px = Math.cos(a) * rad, py = Math.sin(a) * rad * 0.82;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = '#7d8a99'; ctx.fill();
        ctx.lineWidth = r * 0.1; ctx.strokeStyle = '#5b6a78'; ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(-r * 0.25, -r * 0.3, r * 0.34, r * 0.2, -0.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
        ctx.restore();
      }

      function drawWave(cx, cy, r, t) {
        ctx.save(); ctx.translate(cx, cy + Math.sin(t * 3) * r * 0.08);
        ctx.beginPath();
        ctx.moveTo(-r, r * 0.55);
        ctx.quadraticCurveTo(-r * 0.9, -r * 0.5, -r * 0.25, -r * 0.55);
        ctx.quadraticCurveTo(r * 0.35, -r * 0.62, r * 0.55, -r * 0.1);
        ctx.quadraticCurveTo(r * 0.95, -r * 0.45, r, r * 0.1);
        ctx.quadraticCurveTo(r * 1.02, r * 0.55, r * 0.4, r * 0.55);
        ctx.closePath();
        ctx.fillStyle = 'rgba(46, 134, 193, .88)'; ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        var foam = [[-0.3, -0.55, 0.30], [0.05, -0.66, 0.34], [0.42, -0.42, 0.26], [0.72, -0.18, 0.2]];
        for (var i = 0; i < foam.length; i++) {
          ctx.beginPath();
          ctx.arc(foam[i][0] * r, foam[i][1] * r, foam[i][2] * r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawBoat() {
        var bx = PX(boat.x), by = PY(boat.y);
        var u = view.pw; // px per painting width
        var bob = Math.sin(elapsed * 2.6) * u * 0.004;
        ctx.save();
        ctx.translate(bx, by + bob);
        ctx.rotate(boat.tilt);
        if (invincible > 0 && Math.floor(elapsed * 12) % 2 === 0) ctx.globalAlpha = 0.35;
        var s = u * 0.052; // half-width of boat
        /* wake */
        ctx.save(); ctx.globalAlpha *= 0.5;
        ctx.beginPath();
        ctx.ellipse(0, s * 0.62, s * 1.25, s * 0.30, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
        ctx.restore();
        /* sail */
        ctx.beginPath();
        ctx.moveTo(0, -s * 1.28); ctx.lineTo(0, s * 0.1); ctx.lineTo(s * 0.78, s * 0.1);
        ctx.closePath();
        ctx.fillStyle = '#fff7e0'; ctx.fill();
        ctx.lineWidth = s * 0.07; ctx.strokeStyle = '#d9a441'; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -s * 1.28); ctx.lineTo(0, s * 0.1); ctx.lineTo(-s * 0.6, s * 0.1);
        ctx.closePath();
        ctx.fillStyle = '#ffe3a3'; ctx.fill(); ctx.stroke();
        /* flag */
        ctx.beginPath();
        ctx.moveTo(0, -s * 1.3); ctx.lineTo(s * 0.34, -s * 1.16); ctx.lineTo(0, -s * 1.02);
        ctx.closePath(); ctx.fillStyle = '#ff6b6b'; ctx.fill();
        /* mast */
        ctx.beginPath(); ctx.moveTo(0, -s * 1.3); ctx.lineTo(0, s * 0.35);
        ctx.lineWidth = s * 0.09; ctx.strokeStyle = '#8a5a2b'; ctx.stroke();
        /* hull (paper boat) */
        ctx.beginPath();
        ctx.moveTo(-s * 1.05, s * 0.12);
        ctx.lineTo(s * 1.05, s * 0.12);
        ctx.lineTo(s * 0.66, s * 0.72);
        ctx.lineTo(-s * 0.66, s * 0.72);
        ctx.closePath();
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.lineWidth = s * 0.07; ctx.strokeStyle = '#3d7ca8'; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s * 1.05, s * 0.12); ctx.lineTo(0, s * 0.44); ctx.lineTo(s * 1.05, s * 0.12);
        ctx.lineWidth = s * 0.05; ctx.strokeStyle = 'rgba(61,124,168,.5)'; ctx.stroke();
        ctx.restore();
      }

      function drawRainbow() {
        var cx = PX(0.5), cy = PY(0.475);
        var R = view.pw * 0.46;
        var colors = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa'];
        ctx.save();
        ctx.globalAlpha = 0.75;
        ctx.lineCap = 'round';
        for (var i = 0; i < colors.length; i++) {
          ctx.beginPath();
          ctx.arc(cx, cy, R - i * view.pw * 0.016, Math.PI, Math.PI * 2);
          ctx.lineWidth = view.pw * 0.016;
          ctx.strokeStyle = colors[i];
          ctx.stroke();
        }
        ctx.restore();
      }

      function draw() {
        ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
        ctx.clearRect(0, 0, view.w, view.h);
        /* painting as the world */
        if (painting.complete && painting.naturalWidth > 0) {
          ctx.drawImage(painting, view.ox, view.oy, view.pw, view.ph);
        } else {
          ctx.fillStyle = '#a8d8ea'; ctx.fillRect(0, 0, view.w, view.h);
        }
        ctx.save();
        if (shake > 0) {
          var m = shake * 14;
          ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
        }

        var L = LEVELS[level];
        /* typhoon gloom */
        if ((state === 'playing' || state === 'intro' || state === 'clearing') && L.rain) {
          ctx.fillStyle = 'rgba(38, 60, 110, .16)';
          ctx.fillRect(0, 0, view.w, view.h);
        }

        /* rainbow on win */
        if (state === 'win') drawRainbow();

        /* cloud covering the watermark (top-right of the painting), drifting slowly */
        var drift = Math.sin(elapsed * 0.25) * view.pw * 0.012;
        drawCloud(PX(0.905) + drift, PY(0.048), view.pw * 0.30, 0.96);
        /* a second friendly cloud, top-left, just for life */
        var drift2 = Math.sin(elapsed * 0.18 + 2) * view.pw * 0.02;
        drawCloud(PX(0.16) + drift2, PY(0.055), view.pw * 0.17, 0.75);

        /* wind streaks */
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineCap = 'round';
        for (var i = 0; i < windStreaks.length; i++) {
          var ws = windStreaks[i];
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(PX(ws.x), PY(ws.y));
          ctx.lineTo(PX(ws.x) - Math.sign(ws.sp) * view.pw * 0.07, PY(ws.y));
          ctx.stroke();
        }
        ctx.restore();

        /* entities */
        for (var j = 0; j < entities.length; j++) {
          var e = entities[j];
          var ex = PX(e.x), ey = PY(e.y), er = view.pw * e.r;
          if (e.kind === 'star') drawStar(ex, ey, er * (1 + Math.sin(elapsed * 4 + e.wob) * 0.08), Math.sin(elapsed * 1.5 + e.wob) * 0.3);
          else if (e.kind === 'rock') drawRock(ex, ey, er, e.seed);
          else drawWave(ex, ey, er, elapsed + e.wob);
        }

        /* sparkles */
        ctx.save(); ctx.fillStyle = '#ffd93b';
        for (var p = 0; p < particles.length; p++) {
          var pt = particles[p];
          ctx.globalAlpha = Math.max(pt.life / 0.45, 0);
          ctx.beginPath();
          ctx.arc(PX(pt.x), PY(pt.y), view.pw * 0.008, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        /* boat */
        if (state !== 'menu') drawBoat();

        /* rain */
        if (raindrops.length) {
          ctx.save();
          ctx.strokeStyle = 'rgba(230, 244, 255, .65)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
          ctx.beginPath();
          for (var r = 0; r < raindrops.length; r++) {
            var rd = raindrops[r];
            var rx = PX(rd.x), ry = PY(rd.y);
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx - view.pw * 0.012, ry + view.ph * 0.028);
          }
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();
      }

      function loop(ts) {
        var dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
        lastTs = ts;
        if (state !== 'paused') update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      /* ---------------- buttons ---------------- */
      document.getElementById('startBtn').addEventListener('click', function () { ac(); sfxClick(); startGame(); });
      document.getElementById('retryBtn').addEventListener('click', function () {
        ac(); sfxClick(); hide('overScreen'); startLevel(level);
      });
      document.getElementById('againBtn').addEventListener('click', function () { ac(); sfxClick(); startGame(); });
      document.getElementById('pauseBtn').addEventListener('click', function () {
        if (state === 'playing' || state === 'intro') { state = 'paused'; show('pauseScreen'); sfxClick(); }
      });
      document.getElementById('resumeBtn').addEventListener('click', function () {
        hide('pauseScreen'); banner.classList.add('hidden');
        if (state === 'paused') state = 'playing'; sfxClick();
      });
      document.getElementById('restartBtn').addEventListener('click', function () {
        hide('pauseScreen'); sfxClick(); startGame();
      });
      document.getElementById('muteBtn').addEventListener('click', function () {
        muted = !muted;
        this.textContent = muted ? '🔇' : '🔊';
        if (!muted) { ac(); sfxClick(); }
      });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && state === 'playing') { state = 'paused'; show('pauseScreen'); }
      });

      updateHUD();
    </script>
  </body>
</html>
